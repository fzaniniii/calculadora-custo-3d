<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Custo de Impressão 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="description" content="Calculadora do custo real de fabricar uma peça em PLA na Bambu Lab A1 — material, energia, depreciação e manutenção.">

<!-- PWA -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Custo 3D">

<style>
  :root {
    /* Paleta iOS — claro */
    --bg: #f2f2f7;
    --card: #ffffff;
    --label: #000000;
    --label-2: rgba(60,60,67,0.60);
    --label-3: rgba(60,60,67,0.30);
    --sep: rgba(60,60,67,0.29);
    --accent: #ff9500;
    --fill: rgba(120,120,128,0.12);
    --chrome: rgba(242,242,247,0.82);
    --c-material: #ff9500;
    --c-energia:  #34c759;
    --c-deprec:   #007aff;
    --c-manut:    #ff3b30;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --card: #1c1c1e;
      --label: #ffffff;
      --label-2: rgba(235,235,245,0.60);
      --label-3: rgba(235,235,245,0.30);
      --sep: rgba(84,84,88,0.65);
      --accent: #ff9f0a;
      --fill: rgba(120,120,128,0.24);
      --chrome: rgba(0,0,0,0.80);
      --c-material: #ff9f0a;
      --c-energia:  #30d158;
      --c-deprec:   #0a84ff;
      --c-manut:    #ff453a;
    }
  }

  :root[data-theme="dark"] {
    --bg: #000000;
    --card: #1c1c1e;
    --label: #ffffff;
    --label-2: rgba(235,235,245,0.60);
    --label-3: rgba(235,235,245,0.30);
    --sep: rgba(84,84,88,0.65);
    --accent: #ff9f0a;
    --fill: rgba(120,120,128,0.24);
    --chrome: rgba(0,0,0,0.80);
    --c-material: #ff9f0a;
    --c-energia:  #30d158;
    --c-deprec:   #0a84ff;
    --c-manut:    #ff453a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html {
    background: var(--bg);
    height: 100%;
  }

  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--label);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* ---------- Cabeçalho fixo com o resultado ---------- */

  .hero {
    flex: none;
    padding: calc(var(--safe-t) + 10px) calc(var(--safe-r) + 16px) 12px calc(var(--safe-l) + 16px);
    background: var(--chrome);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid var(--sep);
    position: relative;
    z-index: 10;
  }

  .hero-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 2px;
  }

  .hero-cap {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--label-2);
  }

  .hero-printer {
    font-size: 12px;
    font-weight: 500;
    color: var(--label-2);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .hero-printer::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--c-energia);
  }

  .hero-value {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -0.028em;
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
    margin: 0;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .hero-value .cur {
    font-size: 24px;
    font-weight: 600;
    color: var(--label-2);
    letter-spacing: -0.01em;
  }

  .hero-meta {
    font-size: 13px;
    color: var(--label-2);
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }

  /* Barra proporcional */
  .bar {
    display: flex;
    gap: 2px;
    height: 7px;
    margin: 12px 0 0;
  }

  .bar span {
    display: block;
    height: 100%;
    border-radius: 4px;
    transition: flex-grow 0.28s cubic-bezier(0.32,0.72,0,1);
    min-width: 0;
  }

  /* Segmented control (iOS) */
  .seg {
    display: flex;
    background: var(--fill);
    border-radius: 9px;
    padding: 2px;
    margin-top: 12px;
  }

  .seg button {
    flex: 1;
    appearance: none;
    border: none;
    background: transparent;
    color: var(--label);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 8px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }

  .seg button[aria-selected="true"] {
    background: var(--card);
    font-weight: 600;
    box-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 1px 1px rgba(0,0,0,0.04);
  }

  .seg button:active { opacity: 0.6; }

  /* ---------- Área rolável ---------- */

  main {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    padding: 18px calc(var(--safe-r) + 16px) calc(var(--safe-b) + 32px) calc(var(--safe-l) + 16px);
  }

  .inner { max-width: 560px; margin: 0 auto; }

  .sec-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 0 16px 7px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--label-2);
    font-weight: 600;
  }

  .sec-total {
    text-transform: none;
    letter-spacing: 0;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--label-2);
  }

  /* Lista agrupada estilo iOS */
  .group {
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 22px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 50px;
    padding: 9px 16px;
    position: relative;
    cursor: text;
  }

  .row + .row::before {
    content: "";
    position: absolute;
    top: 0; left: 16px; right: 0;
    height: 0.5px;
    background: var(--sep);
  }

  .row-label {
    flex: 1;
    min-width: 0;
    font-size: 16px;
  }

  .row-hint {
    display: block;
    font-size: 12px;
    color: var(--label-2);
    margin-top: 2px;
    line-height: 1.3;
  }

  .row-val {
    display: flex;
    align-items: baseline;
    gap: 4px;
    flex: none;
  }

  .row-val .pre {
    font-size: 15px;
    color: var(--label-2);
    font-variant-numeric: tabular-nums;
  }

  .row-val .unit {
    font-size: 14px;
    color: var(--label-2);
    min-width: 0;
  }

  input[type="number"] {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    background: transparent;
    font: inherit;
    font-size: 17px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    text-align: right;
    padding: 4px 0;
    width: 5.2em;
    -webkit-user-select: text;
    user-select: text;
    border-radius: 6px;
  }

  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  input[type="number"]:focus { outline: none; background: var(--fill); }

  input.narrow { width: 3.4em; }
  input.wide { width: 6.4em; }

  /* Detalhe / rodapé de seção */
  .sec-note {
    padding: 0 16px;
    margin: -14px 0 22px;
    font-size: 12.5px;
    color: var(--label-2);
    font-variant-numeric: tabular-nums;
  }

  /* Detalhamento */
  .detail-row {
    display: flex;
    align-items: center;
    gap: 11px;
    min-height: 44px;
    padding: 8px 16px;
    position: relative;
    font-size: 16px;
  }

  .detail-row + .detail-row::before {
    content: "";
    position: absolute;
    top: 0; left: 16px; right: 0;
    height: 0.5px;
    background: var(--sep);
  }

  .dot {
    width: 10px; height: 10px;
    border-radius: 3px;
    flex: none;
  }

  .detail-row .nm { flex: 1; }

  .detail-row .pc {
    font-size: 13px;
    color: var(--label-2);
    font-variant-numeric: tabular-nums;
    min-width: 3.2em;
    text-align: right;
  }

  .detail-row .vl {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    min-width: 5.4em;
    text-align: right;
  }

  .note {
    display: flex;
    gap: 10px;
    padding: 13px 16px;
    font-size: 13.5px;
    color: var(--label-2);
    line-height: 1.4;
  }

  .note b { color: var(--label); font-weight: 600; }

  .btn-row {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 50px;
    padding: 9px 16px;
    width: 100%;
    appearance: none;
    border: none;
    background: var(--card);
    color: var(--c-manut);
    font: inherit;
    font-size: 16px;
    cursor: pointer;
  }

  .btn-row:active { background: var(--fill); }

  footer {
    text-align: center;
    font-size: 12px;
    color: var(--label-3);
    padding: 4px 0 0;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 340px) {
    .hero-value { font-size: 38px; }
    .row-label { font-size: 15px; }
  }
</style>
</head>
<body>

<!-- ============ RESULTADO FIXO ============ -->
<header class="hero">
  <div class="hero-top">
    <span class="hero-cap" id="heroCap">Custo por peça</span>
    <span class="hero-printer">Bambu Lab A1 · PLA</span>
  </div>

  <div class="hero-value"><span class="cur">R$</span><span id="heroValue">0,00</span></div>
  <div class="hero-meta" id="heroMeta">&nbsp;</div>

  <div class="bar" id="bar">
    <span style="background:var(--c-material)"></span>
    <span style="background:var(--c-energia)"></span>
    <span style="background:var(--c-deprec)"></span>
    <span style="background:var(--c-manut)"></span>
  </div>

  <div class="seg" role="tablist">
    <button type="button" role="tab" id="segPeca" aria-selected="true">Por peça</button>
    <button type="button" role="tab" id="segJob" aria-selected="false">Job inteiro</button>
  </div>
</header>

<!-- ============ CONTEÚDO ============ -->
<main>
<div class="inner">

  <div class="sec-head"><span>A peça</span></div>
  <div class="group">
    <label class="row">
      <span class="row-label">Peso do job
        <span class="row-hint">gramas no fatiador, com purga e suporte</span></span>
      <span class="row-val">
        <input type="number" id="peso" value="45" min="0" step="1" inputmode="decimal">
        <span class="unit">g</span></span>
    </label>
    <label class="row">
      <span class="row-label">Tempo do job
        <span class="row-hint">o job inteiro, não por peça</span></span>
      <span class="row-val">
        <input type="number" id="tempo" value="3.5" min="0" step="0.1" inputmode="decimal">
        <span class="unit">h</span></span>
    </label>
    <label class="row">
      <span class="row-label">Peças por job
        <span class="row-hint">mais peças juntas, mais barata cada uma</span></span>
      <span class="row-val">
        <input type="number" id="qtd" class="narrow" value="1" min="1" step="1" inputmode="numeric">
        <span class="unit">un</span></span>
    </label>
  </div>

  <div class="sec-head"><span>Material</span><span class="sec-total" id="sub-material">R$ 0,00</span></div>
  <div class="group">
    <label class="row">
      <span class="row-label">Filamento PLA
        <span class="row-hint">sua faixa: R$ 85 a 100 o quilo</span></span>
      <span class="row-val"><span class="pre">R$</span>
        <input type="number" id="precoKg" value="92.5" min="0" step="0.5" inputmode="decimal">
        <span class="unit">/kg</span></span>
    </label>
  </div>

  <div class="sec-head"><span>Energia</span><span class="sec-total" id="sub-energia">R$ 0,00</span></div>
  <div class="group">
    <label class="row">
      <span class="row-label">Tarifa
        <span class="row-hint">da sua conta CEMIG</span></span>
      <span class="row-val"><span class="pre">R$</span>
        <input type="number" id="tarifa" class="wide" value="0.92214" min="0" step="0.001" inputmode="decimal">
        <span class="unit">/kWh</span></span>
    </label>
    <label class="row">
      <span class="row-label">Potência média
        <span class="row-hint">imprimindo, com AMS se usar</span></span>
      <span class="row-val">
        <input type="number" id="potencia" class="narrow" value="130" min="0" step="5" inputmode="decimal">
        <span class="unit">W</span></span>
    </label>
  </div>

  <div class="sec-head"><span>Depreciação</span><span class="sec-total" id="sub-deprec">R$ 0,00</span></div>
  <div class="group">
    <label class="row">
      <span class="row-label">Valor pago na A1</span>
      <span class="row-val"><span class="pre">R$</span>
        <input type="number" id="valorImpressora" value="6000" min="0" step="50" inputmode="decimal"></span>
    </label>
    <label class="row">
      <span class="row-label">Vida útil estimada
        <span class="row-hint">horas até o fim de vida</span></span>
      <span class="row-val">
        <input type="number" id="vidaUtil" value="5000" min="1" step="100" inputmode="decimal">
        <span class="unit">h</span></span>
    </label>
    <label class="row">
      <span class="row-label">Horas já rodadas</span>
      <span class="row-val">
        <input type="number" id="horasRodadas" value="384" min="0" step="1" inputmode="decimal">
        <span class="unit">h</span></span>
    </label>
  </div>
  <div class="sec-note" id="deprecDerived"></div>

  <div class="sec-head"><span>Manutenção</span><span class="sec-total" id="sub-manut">R$ 0,00</span></div>
  <div class="group">
    <label class="row">
      <span class="row-label">Custo por hora de máquina
        <span class="row-hint">bico, placa, correias, lubrificação</span></span>
      <span class="row-val"><span class="pre">R$</span>
        <input type="number" id="manutHora" value="0.20" min="0" step="0.01" inputmode="decimal">
        <span class="unit">/h</span></span>
    </label>
  </div>

  <div class="sec-head"><span>Detalhamento</span><span class="sec-total" id="detailCap">por peça</span></div>
  <div class="group" id="detail"></div>

  <div class="group">
    <div class="note">
      <span>⚠️</span>
      <div>Não inclui pós-processamento, embalagem nem <b>margem de lucro</b> — só o custo de fabricar.</div>
    </div>
  </div>

  <div class="group">
    <button type="button" class="btn-row" id="reset">Restaurar valores padrão</button>
  </div>

  <footer>Custo 3D · valores em BRL</footer>

</div>
</main>

<script>
  var DEFAULTS = {
    peso: "45", tempo: "3.5", qtd: "1", precoKg: "92.5",
    tarifa: "0.92214", potencia: "130", valorImpressora: "6000",
    vidaUtil: "5000", horasRodadas: "384", manutHora: "0.20"
  };

  var ids = Object.keys(DEFAULTS);
  var el = {};
  ids.forEach(function (id) { el[id] = document.getElementById(id); });

  var STORAGE_KEY = "calc3d.custoImpressao.v1";
  var VIEW_KEY = "calc3d.view.v1";
  var view = "peca";

  var nf = function (n, d) {
    return n.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
  };
  var brl = function (n) { return "R$ " + nf(n, 2); };

  function salvar() {
    try {
      var data = {};
      ids.forEach(function (id) { data[id] = el[id].value; });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      localStorage.setItem(VIEW_KEY, view);
    } catch (e) { /* indisponível */ }
  }

  function carregar() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var data = JSON.parse(raw);
        ids.forEach(function (id) {
          if (data[id] !== undefined && el[id]) el[id].value = data[id];
        });
      }
      var v = localStorage.getItem(VIEW_KEY);
      if (v === "job" || v === "peca") view = v;
    } catch (e) { /* ignora */ }
  }

  function num(id, min) {
    var v = parseFloat(el[id].value);
    if (!isFinite(v)) v = 0;
    return min !== undefined ? Math.max(v, min) : v;
  }

  function calc() {
    var tempo = num("tempo", 0);
    var qtd = Math.max(Math.floor(num("qtd", 1)), 1);

    var material = (num("peso", 0) / 1000) * num("precoKg", 0);
    var energia  = (num("potencia", 0) / 1000) * tempo * num("tarifa", 0);

    var vidaRestante = Math.max(num("vidaUtil", 1) - num("horasRodadas", 0), 1);
    var custoHora = num("valorImpressora", 0) / vidaRestante;
    var deprec = custoHora * tempo;

    var manut = num("manutHora", 0) * tempo;

    var total = material + energia + deprec + manut;
    var div = view === "peca" ? qtd : 1;

    document.getElementById("sub-material").textContent = brl(material);
    document.getElementById("sub-energia").textContent  = brl(energia);
    document.getElementById("sub-deprec").textContent   = brl(deprec);
    document.getElementById("sub-manut").textContent    = brl(manut);

    document.getElementById("deprecDerived").textContent =
      "Restam " + nf(vidaRestante, 0) + " h de vida útil · R$ " + nf(custoHora, 4) + " por hora";

    /* Resultado principal */
    document.getElementById("heroValue").textContent = nf(total / div, 2);
    document.getElementById("heroCap").textContent =
      view === "peca" ? "Custo por peça" : "Custo do job";

    var meta;
    if (view === "peca") {
      meta = qtd > 1
        ? brl(total) + " do job ÷ " + qtd + " peças · " + nf(tempo, 1) + " h"
        : "Job de 1 peça · " + nf(tempo, 1) + " h de impressão";
    } else {
      meta = qtd + (qtd > 1 ? " peças" : " peça") + " · " + nf(tempo, 1) + " h · " +
             brl(total / qtd) + " cada";
    }
    document.getElementById("heroMeta").textContent = meta;

    /* Barra proporcional */
    var parts = [
      { nm: "Material",    val: material, cls: "--c-material" },
      { nm: "Energia",     val: energia,  cls: "--c-energia" },
      { nm: "Depreciação", val: deprec,   cls: "--c-deprec" },
      { nm: "Manutenção",  val: manut,    cls: "--c-manut" }
    ];

    var segs = document.getElementById("bar").children;
    for (var i = 0; i < parts.length; i++) {
      var frac = total > 0 ? parts[i].val / total : 0.25;
      segs[i].style.flexGrow = frac;
      segs[i].style.flexBasis = "0";
      segs[i].style.opacity = frac < 0.004 ? "0" : "1";
    }

    /* Detalhamento */
    document.getElementById("detailCap").textContent =
      view === "peca" ? "por peça" : "do job";

    document.getElementById("detail").innerHTML = parts.map(function (p) {
      var pct = total > 0 ? (p.val / total) * 100 : 0;
      return '<div class="detail-row">' +
             '<span class="dot" style="background:var(' + p.cls + ')"></span>' +
             '<span class="nm">' + p.nm + '</span>' +
             '<span class="pc">' + pct.toFixed(0) + '%</span>' +
             '<span class="vl">' + brl(p.val / div) + '</span>' +
             '</div>';
    }).join("");

    salvar();
  }

  function setView(v) {
    view = v;
    document.getElementById("segPeca").setAttribute("aria-selected", v === "peca");
    document.getElementById("segJob").setAttribute("aria-selected", v === "job");
    calc();
  }

  carregar();

  ids.forEach(function (id) {
    el[id].addEventListener("input", calc);
    /* seleciona tudo ao focar: digitar substitui o valor */
    el[id].addEventListener("focus", function () {
      var input = this;
      setTimeout(function () { try { input.select(); } catch (e) {} }, 1);
    });
  });

  document.getElementById("segPeca").addEventListener("click", function () { setView("peca"); });
  document.getElementById("segJob").addEventListener("click", function () { setView("job"); });

  document.getElementById("reset").addEventListener("click", function () {
    ids.forEach(function (id) { el[id].value = DEFAULTS[id]; });
    calc();
  });

  setView(view);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
